<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Luceria · Tonight</title>
<style>
  @font-face { font-family: Inter; src: url('./vendor/inter-300.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
  @font-face { font-family: Inter; src: url('./vendor/inter-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: Inter; src: url('./vendor/inter-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: Inter; src: url('./vendor/inter-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
  @font-face { font-family: Inter; src: url('./vendor/inter-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

  :root {
    --bg-base: #121110;
    --bg-elevated: #282522;
    --fill-1: #1D1B19;
    --fill-2: #282522;
    --fill-3: #3A3530;
    --text-primary: #F4F0E9;
    --text-secondary: #ACA59B;
    --text-tertiary: #8A837A;
    --accent: #F0A64B;
    --accent-on: #1A1206;
    --line-subtle: #2F2C29;
    --status-ready: #8FC27A;
    --status-missing: #EFA54A;
    --scrim: rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #080706; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; }
  [v-cloak] { display: none; }

  #app { min-height: 100vh; }
  .stage {
    min-height: 100vh;
    padding: 28px;
    display: grid;
    place-items: center;
    background:
      radial-gradient(1200px 700px at 50% 18%, #181310 0%, #080706 68%),
      #080706;
  }
  .canvas-wrap { position: relative; }
  .ipad {
    position: absolute;
    top: 0;
    left: 0;
    width: 1194px;
    height: 834px;
    overflow: hidden;
    border-radius: 26px;
    background: var(--bg-base);
    transform-origin: top left;
    box-shadow:
      0 40px 100px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(255, 255, 255, 0.06);
  }

  /* iPad system status bar, preview only */
  .statusbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 6;
    height: 24px;
    padding: 0 26px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: #F4F0E9;
    letter-spacing: 0.01em;
    pointer-events: none;
  }
  .statusbar .left, .statusbar .right { display: flex; align-items: center; gap: 7px; }
  .battery {
    width: 22px; height: 11px;
    border: 1.5px solid rgba(255,255,255,.85);
    border-radius: 3px;
    position: relative;
  }
  .battery::after {
    content: '';
    position: absolute;
    left: 1.5px; top: 1.5px; bottom: 1.5px;
    width: 16px;
    border-radius: 1px;
    background: #F4F0E9;
  }

  .hero {
    position: relative;
    height: 540px;
    padding: 152px 40px 0;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(18,17,16,.55) 100%);
  }
  .hero-copy { position: relative; z-index: 2; width: 610px; }
  .overline {
    margin: 0 0 13px;
    font-size: 13px;
    line-height: 16px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 18px;
    font-size: 88px;
    line-height: 92px;
    font-weight: 700;
    letter-spacing: -2px;
    color: var(--text-primary);
  }
  .lede {
    margin: 0 0 22px;
    max-width: 560px;
    font-size: 18px;
    line-height: 26px;
    font-weight: 400;
    letter-spacing: -0.2px;
    color: var(--text-secondary);
  }
  .meta { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .pill {
    height: 36px;
    padding: 0 18px;
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    background: var(--fill-2);
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.1px;
    white-space: nowrap;
  }
  .actions { display: flex; align-items: center; gap: 14px; }
  .btn {
    height: 52px;
    padding: 0 28px;
    border: 0;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease, opacity .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-on); }
  .btn.primary:hover { background: #F5B35F; }
  .btn.secondary { background: var(--fill-2); color: var(--text-primary); }
  .btn.secondary:hover { background: #302C28; }
  .btn.icon {
    width: 44px; height: 44px; padding: 0;
    border-radius: 50%;
    background: var(--fill-2);
    color: var(--text-primary);
  }
  .btn.icon:hover { background: #302C28; }

  .top-actions {
    position: absolute;
    top: 54px;
    right: 40px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .round {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.06);
    background: rgba(40,37,34,.88);
    color: var(--text-primary);
    display: grid;
    place-items: center;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: transform .15s ease, background .15s ease;
  }
  .round:active { transform: scale(.94); }
  .round:hover { background: rgba(52,48,43,.95); }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.08);
    background: #4A3527;
    color: var(--accent);
    display: grid;
    place-items: center;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
  }
  .bell-dot {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    top: 10px; right: 10px;
  }

  .hero-art {
    position: absolute;
    top: 64px;
    right: 92px;
    z-index: 1;
    width: 380px;
    height: 390px;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .art-glow {
    position: absolute;
    width: 430px; height: 330px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(240,166,75,.26) 0%, rgba(240,166,75,.08) 42%, rgba(240,166,75,0) 70%);
    filter: blur(18px);
  }
  .hero-art img {
    position: relative;
    width: 330px;
    height: auto;
    filter: brightness(1.18) saturate(1.12) contrast(1.02) drop-shadow(0 26px 46px rgba(0,0,0,.45));
    animation: pour-in 900ms cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes pour-in {
    from { opacity: 0; transform: translateY(12px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .also {
    position: relative;
    z-index: 3;
    padding: 0 40px;
    margin-top: 6px;
  }
  .also-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .also-head h2 {
    margin: 0;
    font-size: 24px;
    line-height: 30px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .see-all {
    border: 0;
    background: transparent;
    color: var(--text-primary);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    line-height: 20px;
    font-weight: 500;
    cursor: pointer;
    padding: 8px 0;
  }
  .see-all:hover { color: var(--accent); }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .card {
    height: 88px;
    padding: 0 22px 0 10px;
    border: 1px solid rgba(255,255,255,.03);
    border-radius: 999px;
    background: var(--fill-2);
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    color: inherit;
    transition: background .18s ease, transform .18s ease;
  }
  .card:hover { background: #2E2A26; }
  .card:active { transform: scale(.995); }
  .thumb {
    width: 68px; height: 68px;
    flex: 0 0 68px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--fill-1);
    position: relative;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.18);
    filter: saturate(1.06);
  }
  .card-title {
    margin: 0 0 3px;
    font-size: 17px;
    line-height: 22px;
    font-weight: 600;
    letter-spacing: -0.2px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    line-height: 18px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .card-sub .ready { color: var(--status-ready); display: inline-flex; }
  .chev { margin-left: auto; color: var(--text-tertiary); display: flex; }

  .tabbar {
    position: absolute;
    left: 50%;
    bottom: 28px;
    z-index: 10;
    transform: translateX(-50%);
    width: 560px;
    height: 68px;
    padding: 0 5px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.06);
    background: rgba(40,37,34,.78);
    box-shadow: 0 12px 32px rgba(0,0,0,.28);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex;
    align-items: center;
    justify-content: space-around;
  }
  .tab {
    width: 105px;
    height: 56px;
    border: 0;
    border-radius: 28px;
    background: transparent;
    color: var(--text-tertiary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11px;
    line-height: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .tab svg { display: block; }
  .tab.active {
    background: rgba(255,255,255,.055);
    color: var(--text-primary);
  }
  .tab.active svg { color: var(--accent); }
  .tab:hover { color: var(--text-primary); }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 112px;
    z-index: 30;
    transform: translateX(-50%);
    max-width: 520px;
    padding: 12px 20px;
    border-radius: 999px;
    background: var(--text-primary);
    color: #1A1206;
    font-size: 14px;
    line-height: 18px;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 16px 40px rgba(0,0,0,.35);
    animation: toast-in 180ms ease-out both;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="stage">
    <div class="canvas-wrap" :style="{ width: (1194 * scale) + 'px', height: (834 * scale) + 'px' }">
      <div class="ipad" :style="{ transform: `scale(${scale})` }">
        <div class="statusbar">
          <div class="left"><span>9:41</span><span>Sat 14 Nov</span></div>
          <div class="right"><span>100%</span><span class="battery"></span></div>
        </div>

        <section class="hero" :style="heroStyle">
          <div class="top-actions">
            <button class="round" type="button" aria-label="Search" @click="notYet('Search')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path>
              </svg>
            </button>
            <button class="round" type="button" aria-label="Notifications" @click="notYet('Notifications')" style="position:relative">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 9a6 6 0 10-12 0c0 6-2 6-2 7h16c0-1-2-1-2-7"></path>
                <path d="M10 20h4"></path>
              </svg>
              <span class="bell-dot"></span>
            </button>
            <button class="avatar" type="button" aria-label="Profile" @click="notYet('Profile')">M</button>
          </div>

          <div class="hero-copy">
            <p class="overline">YOUR POUR FOR TONIGHT</p>
            <h1>{{ hero.name }}</h1>
            <p class="lede">{{ hero.lede }}</p>
            <div class="meta">
              <span class="pill" v-for="item in hero.meta" :key="item">{{ item }}</span>
            </div>
            <div class="actions">
              <button class="btn primary" type="button" @click="notYet('Mixing flow')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M8 5.5v13l10-6.5-10-6.5z"></path>
                </svg>
                Start mixing
              </button>
              <button class="btn secondary" type="button" @click="notYet('Recipe detail')">View recipe</button>
              <button class="btn icon" type="button" aria-label="Shuffle tonight's pour" @click="notYet('Another pour')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7h3c4 0 6 10 10 10h3"></path>
                  <path d="M4 17h3c4 0 6-10 10-10h3"></path>
                  <path d="M17 4l3 3-3 3"></path>
                  <path d="M17 14l3 3-3 3"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="hero-art" aria-hidden="true">
            <div class="art-glow"></div>
            <img :src="hero.image" :alt="''" />
          </div>
        </section>

        <section class="also">
          <div class="also-head">
            <h2>Also ready tonight</h2>
            <button class="see-all" type="button" @click="notYet('All recipes')">
              All 7 you can make
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 5l7 7-7 7"></path>
              </svg>
            </button>
          </div>
          <div class="cards">
            <button class="card" type="button" v-for="drink in also" :key="drink.name" @click="notYet(drink.name)">
              <span class="thumb"><img :src="drink.thumb" :alt="''" /></span>
              <span>
                <span class="card-title">{{ drink.name }}</span>
                <span class="card-sub">
                  <span class="ready">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path>
                    </svg>
                  </span>
                  {{ drink.status }}
                </span>
              </span>
              <span class="chev">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9 5l7 7-7 7"></path>
                </svg>
              </span>
            </button>
          </div>
        </section>

        <nav class="tabbar" aria-label="Main">
          <button
            v-for="tab in tabs"
            :key="tab.id"
            class="tab"
            :class="{ active: tab.id === 'tonight' }"
            type="button"
            @click="tab.id === 'tonight' ? null : notYet(tab.label)"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" v-html="tab.icon"></svg>
            <span>{{ tab.label }}</span>
          </button>
        </nav>

        <transition name="toast">
          <div class="toast" v-if="toast">{{ toast }}</div>
        </transition>
      </div>
    </div>
  </div>
</div>

<script src="./vendor/vue.global.prod.js"></script>
<script>
  const { createApp } = Vue

  createApp({
    data() {
      return {
        scale: 1,
        toast: '',
        toastTimer: null,
        hero: {
          name: 'Negroni',
          lede: 'Bittersweet and balanced — gin, Campari and sweet vermouth in equal parts. Everything is already in your bar.',
          meta: ['Gin', 'Stirred', '21.6% ABV', '2 min'],
          hue: '#2E1C1D',
          glow: 'rgba(208,83,63,.32)',
          image: './assets/negroni.png'
        },
        also: [
          { name: 'Whiskey Sour', status: 'Ready · 4 min', thumb: './assets/thumb-whiskey-sour.png' },
          { name: 'Margarita', status: 'Ready · 3 min', thumb: './assets/thumb-margarita.png' },
          { name: 'Black Russian', status: 'Ready · 1 min', thumb: './assets/thumb-black-russian.png' }
        ],
        tabs: [
          { id: 'tonight', label: 'Tonight', icon: '<path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"></path>' },
          { id: 'recipes', label: 'Recipes', icon: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5v-13z"></path><path d="M8 7h8M8 11h6"></path>' },
          { id: 'bar', label: 'My Bar', icon: '<path d="M9 3h6v3l-1 2v11H10V8L9 6V3z"></path><path d="M10 12h4"></path>' },
          { id: 'list', label: 'List', icon: '<path d="M4 5h2l2 10h9l2-7H7"></path><circle cx="9.5" cy="19" r="1.2"></circle><circle cx="17" cy="19" r="1.2"></circle>' },
          { id: 'journal', label: 'Journal', icon: '<rect x="4" y="5" width="16" height="16" rx="2.5"></rect><path d="M8 3v4M16 3v4M4 10h16"></path><path d="M8 14h4"></path>' }
        ]
      }
    },
    computed: {
      heroStyle() {
        return {
          background: `radial-gradient(46% 55% at 78% 46%, ${this.hero.glow} 0%, rgba(208,83,63,0) 70%), linear-gradient(180deg, ${this.hero.hue} 0%, #121110 60%)`
        }
      }
    },
    mounted() {
      this.resize()
      window.addEventListener('resize', this.resize)
    },
    beforeUnmount() {
      window.removeEventListener('resize', this.resize)
      if (this.toastTimer) clearTimeout(this.toastTimer)
    },
    methods: {
      resize() {
        const pad = 56
        const sx = (window.innerWidth - pad) / 1194
        const sy = (window.innerHeight - pad) / 834
        this.scale = Math.max(0.42, Math.min(1, sx, sy))
      },
      notYet(label) {
        if (this.toastTimer) clearTimeout(this.toastTimer)
        this.toast = `${label} is next — this preview is Tonight.`
        this.toastTimer = setTimeout(() => { this.toast = '' }, 2200)
      }
    }
  }).mount('#app')
</script>
</body>
</html>
